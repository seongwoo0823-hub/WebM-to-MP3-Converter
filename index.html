<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebM to MP3 Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg.wasm UMD Scripts -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        /* iOS 스타일의 부드러운 폰트 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* 애니메이션 효과를 위한 메쉬 그라디언트 배경 */
        .bg-mesh {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 글래스모피즘 커스텀 유틸리티 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 0 0 15px rgba(255,255,255,0.2) inset;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        
        .glass-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1);
        }

        .glass-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 숨겨진 파일 인풋 */
        input[type="file"] {
            display: none;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex items-center justify-center p-4">

    <!-- 메인 컨테이너 (Glassmorphism Card) -->
    <div class="glass-panel rounded-[2.5rem] p-8 w-full max-w-md text-center relative overflow-hidden flex flex-col items-center">
        
        <!-- 타이틀 영역 -->
        <div class="mb-8">
            <h1 class="text-2xl font-semibold text-gray-800 tracking-tight">Audio Converter</h1>
            <p class="text-sm text-gray-600 mt-1 font-light">Convert WebM to MP3 directly on your device</p>
        </div>

        <!-- 파일 업로드 영역 -->
        <label for="file-input" id="drop-zone" class="w-full flex flex-col items-center justify-center p-6 border-2 border-dashed border-white/60 rounded-3xl bg-white/20 hover:bg-white/30 transition-all cursor-pointer mb-6 group">
            <svg class="w-10 h-10 text-gray-600 mb-3 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <span id="file-name" class="text-gray-700 font-medium text-sm">Tap to select WebM files</span>
        </label>
        <input type="file" id="file-input" accept=".webm,video/webm,audio/webm" multiple />

        <!-- 컨트롤 및 상태 영역 -->
        <div class="w-full flex flex-col items-center space-y-4">
            
            <!-- 변환 버튼 -->
            <button id="convert-btn" class="glass-button text-gray-800 font-semibold py-3 px-8 rounded-full w-full shadow-sm hidden flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Convert All
            </button>

            <!-- 프로그레스 바 영역 -->
            <div id="progress-container" class="w-full hidden">
                <div class="flex justify-between text-xs text-gray-600 mb-2 px-1 font-medium">
                    <span id="status-text">Ready</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-white/40 rounded-full h-2.5 overflow-hidden shadow-inner border border-white/50">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-400 to-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- 개별 파일 목록 영역 -->
            <div id="file-list-container" class="w-full mt-2 hidden flex-col max-h-52 overflow-y-auto pr-1">
                <ul id="file-list" class="space-y-2 w-full"></ul>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const convertBtn = document.getElementById('convert-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const statusText = document.getElementById('status-text');
        const dropZone = document.getElementById('drop-zone');
        const fileListContainer = document.getElementById('file-list-container');
        const fileList = document.getElementById('file-list');

        let ffmpeg = null;
        let selectedFiles = [];
        let isConverting = false;

        // Initialize FFmpeg
        const initFFmpeg = async () => {
            if (ffmpeg) return;
            
            statusText.textContent = "Loading Engine...";
            
            const { FFmpeg } = window.FFmpegWASM;
            const { toBlobURL } = window.FFmpegUtil;
            
            ffmpeg = new FFmpeg();

            // Progress event listener
            ffmpeg.on('progress', ({ progress }) => {
                const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
                progressBar.style.width = `${pct}%`;
                progressText.textContent = `${pct}%`;
            });

            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd';
            
            try {
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                    classWorkerURL: await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript'),
                });
                statusText.textContent = "Ready";
            } catch (error) {
                console.error("FFmpeg Load Error:", error);
                statusText.textContent = "Engine failed to load.";
                alert("Failed to load FFmpeg. Please check your network or try a different browser.");
            }
        };

        // File Selection Logic
        fileInput.addEventListener('change', (e) => {
            if (isConverting) return;
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                selectedFiles = files;
                fileNameDisplay.textContent = `${files.length} file(s) selected`;
                
                // Render List
                fileList.innerHTML = '';
                files.forEach((file, index) => {
                    const li = document.createElement('li');
                    li.className = 'glass-button rounded-xl p-3 flex justify-between items-center text-sm w-full text-left';
                    li.id = `file-item-${index}`;
                    
                    let name = file.name;
                    if (name.length > 20) name = name.substring(0, 10) + '...' + name.substring(name.length - 8);
                    
                    li.innerHTML = `
                        <div class="flex flex-col truncate pr-2">
                            <span class="font-medium text-gray-800">${name}</span>
                            <span class="text-xs text-gray-500 status-lbl">Pending...</span>
                        </div>
                        <a class="download-link hidden bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold py-1.5 px-3 rounded-full shadow-sm transition-all" download>
                            Download
                        </a>
                    `;
                    fileList.appendChild(li);
                });

                // UI State Updates
                convertBtn.classList.remove('hidden');
                convertBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Convert All (${files.length})`;
                fileListContainer.classList.remove('hidden');
                progressContainer.classList.add('hidden');
                dropZone.classList.add('border-solid', 'bg-white/40');
                dropZone.classList.remove('border-dashed');
            }
        });

        // Conversion Logic
        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0 || isConverting) return;
            isConverting = true;

            // UI State Updates
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50');
            progressContainer.classList.remove('hidden');

            try {
                await initFFmpeg();

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const listItem = document.getElementById(`file-item-${i}`);
                    const statusLbl = listItem.querySelector('.status-lbl');
                    const dlLink = listItem.querySelector('.download-link');

                    statusText.textContent = `Processing ${i + 1} of ${selectedFiles.length}...`;
                    statusLbl.textContent = "Converting...";
                    statusLbl.classList.replace('text-gray-500', 'text-blue-600');
                    
                    progressBar.style.width = '0%';
                    progressText.textContent = '0%';

                    const { fetchFile } = window.FFmpegUtil;
                    const fileData = await fetchFile(file);
                    
                    const inputName = `input_${i}.webm`;
                    const outputName = `output_${i}.mp3`;
                    
                    await ffmpeg.writeFile(inputName, fileData);

                    await ffmpeg.exec([
                        '-i', inputName,
                        '-vn',
                        '-ar', '44100',
                        '-b:a', '192k',
                        outputName
                    ]);

                    const outputData = await ffmpeg.readFile(outputName);
                    const blob = new Blob([outputData.buffer], { type: 'audio/mp3' });
                    const url = URL.createObjectURL(blob);

                    const originalName = file.name.replace(/\.[^/.]+$/, "");
                    dlLink.href = url;
                    dlLink.download = `${originalName}.mp3`;
                    dlLink.classList.remove('hidden');

                    statusLbl.textContent = "Done";
                    statusLbl.classList.replace('text-blue-600', 'text-green-600');

                    // 브라우저 메모리 관리를 위한 가상 파일 시스템 정리
                    await ffmpeg.deleteFile(inputName);
                    await ffmpeg.deleteFile(outputName);
                }

                statusText.textContent = "All files converted successfully!";
                progressBar.style.width = '100%';
                progressText.textContent = '100%';
                
            } catch (error) {
                console.error("Conversion Error:", error);
                statusText.textContent = "Error occurred during conversion.";
                progressBar.classList.replace('from-blue-400', 'from-red-400');
                progressBar.classList.replace('to-indigo-500', 'to-red-500');
            } finally {
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-50');
                convertBtn.classList.add('hidden'); // 모든 변환이 끝나면 버튼 숨기기
                isConverting = false;
            }
        });
    </script>
</body>
</html>
